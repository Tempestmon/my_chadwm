# picom 13 config: NVIDIA proprietary driver, X11, single 4K@240 Hz monitor.

# Composite on the GPU via OpenGL; picom 12+ has no default backend.
backend = "glx";

# Sync buffer swaps to the display refresh (240 Hz) to avoid tearing.
vsync = true;

# Repaint only damaged regions instead of the whole 4K frame.
use-damage = true;

# Keep fullscreen windows composited too: without gaming there's no latency
# win, and unredirecting on NVIDIA can cause a flicker on every switch.
unredir-if-possible = false;

# Visual effects off for now; enable when we do the theme.
shadow = false;
fading = false;
