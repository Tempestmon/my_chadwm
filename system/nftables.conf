#!/usr/sbin/nft -f
# Desktop firewall: inbound default-drop + VPN kill-switch.
#
# Traffic model:
#   - all non-LAN traffic is routed into tun0 (tun2socks -> xray);
#   - only xray (uid "xray") may talk to the internet via the physical NICs:
#     proxy traffic to the VPS and "direct" traffic (.ru, Yandex DoT);
#   - if tun2socks dies, the /1 routes disappear and everything else hits
#     the physical NIC -> rejected here instead of leaking to the ISP.

flush ruleset

define PHYS = { "enp12s0", "wlp13s0" }
define LAN4 = 192.168.0.0/16
define XRAY_MARK = 0x10

table inet filter {

    chain input {
        type filter hook input priority filter; policy drop;

        ct state invalid drop
        ct state { established, related } accept
        iif "lo" accept

        # DHCPv4 offers/acks may arrive as broadcast, untracked by conntrack
        udp sport 67 udp dport 68 accept

        # Essential ICMP (path MTU discovery, unreachable, time exceeded)
        icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
        # IPv6 neighbor discovery is link-local only and needed for the link to work
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
                      nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } ip6 saddr fe80::/10 accept

        # Optional: expose dev servers to the LAN (e.g. testing from a phone).
        # iifname $PHYS ip saddr $LAN4 tcp dport 8000-8999 accept

        # Rate-limited log of what we drop -> kernel log -> socklog "kernel"
        limit rate 5/minute log prefix "nft-in-drop: " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        # Nothing is routed through this host (yet). Docker will need rules here.
    }

    chain output {
        type filter hook output priority filter; policy accept;

        # Only traffic leaving via a physical NIC is restricted
        oifname $PHYS jump physical_out
    }

    chain physical_out {
        # Flows opened by xray are marked once and accepted for their whole
        # lifetime (covers kernel-sent packets like TIME_WAIT ACKs that no
        # longer have a socket owner). There is deliberately no generic
        # "ct state established accept" here: a flow that started in tun0
        # must not continue on the physical NIC after the tunnel goes down.
        ct mark $XRAY_MARK accept

        # xray: proxy connections to the VPS + "direct" outbound
        meta skuid "xray" ct mark set $XRAY_MARK accept

        # LAN (router, local devices) and DHCP
        ip daddr $LAN4 accept
        udp sport 68 udp dport 67 accept

        # IPv6: link-local only (neighbor discovery); no global v6 may leave
        ip6 daddr { fe80::/10, ff02::/16 } accept

        # Kill-switch: anything else would bypass the tunnel. Reject (not drop)
        # so apps fail fast instead of hanging; log a sample for diagnostics.
        limit rate 5/minute log prefix "nft-killswitch: " level info
        reject with icmpx type admin-prohibited
    }
}
