# Local caching resolver for the desktop. Every upstream query uses DNS-over-TLS:
#   ru. su. xn--p1ai. (.рф) -> Yandex DoT     (xray routes 77.88.8.0/24 direct: geoip:ru)
#   everything else         -> Cloudflare + Quad9 DoT (routed through the VPS tunnel)
# Nothing leaves this host as plaintext DNS.

server:
    # Listen on loopback only; nobody else may query us
    interface: 127.0.0.1
    interface: ::1
    port: 53
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow

    username: "_unbound"
    chroot: ""
    directory: "/etc/unbound"

    # Log to stderr -> runit log service -> socklog
    use-syslog: no
    logfile: ""
    verbosity: 1
    log-servfail: yes

    # No global IPv6 on this host: don't waste time on v6 upstreams
    do-ip6: no

    # Verify DoT upstream certificates against the system CA bundle
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

    # DNSSEC validation; unbound keeps the root key updated (RFC 5011)
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    harden-dnssec-stripped: yes
    harden-glue: yes

    # Privacy
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes

    # Cache: refresh popular records before they expire, and answer from
    # stale cache for a while if upstream is briefly unreachable (tunnel flaps)
    prefetch: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    msg-cache-size: 32m
    rrset-cache-size: 64m

    # Keep probing upstreams marked as down: notice quickly when the tunnel comes back
    infra-keep-probing: yes

# Russian zones: Yandex DoT. Hostname after '#' is checked against the TLS cert.
forward-zone:
    name: "ru."
    forward-tls-upstream: yes
    forward-addr: 77.88.8.8@853#common.dot.dns.yandex.net
    forward-addr: 77.88.8.1@853#common.dot.dns.yandex.net

forward-zone:
    name: "su."
    forward-tls-upstream: yes
    forward-addr: 77.88.8.8@853#common.dot.dns.yandex.net
    forward-addr: 77.88.8.1@853#common.dot.dns.yandex.net

forward-zone:
    name: "xn--p1ai."
    forward-tls-upstream: yes
    forward-addr: 77.88.8.8@853#common.dot.dns.yandex.net
    forward-addr: 77.88.8.1@853#common.dot.dns.yandex.net

# Everything else: Cloudflare + Quad9 DoT; unbound picks the fastest by RTT.
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#one.one.one.one
    forward-addr: 1.0.0.1@853#one.one.one.one
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
